<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SeismicML — Live Forecast</title>
  <meta name="description" content="ML seismic forecasting: 30-day precursors, M≥4.5 in the next 7 days. Interactive tour + honest verification." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="world-observatory">
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true">◢</span>
      <span class="brand-name">SeismicML</span>
      <span class="brand-sub">FORECAST SYSTEM</span>
    </div>
    <div class="chips" id="chips">
      <span class="chip" id="chip-model"><b>Model</b> —</span>
      <span class="chip" id="chip-window"><b>Window</b> —</span>
      <span class="chip" id="chip-mode">—</span>
      <span class="chip"><b>M≥4.5</b> · 7-day horizon</span>
    </div>
    <div class="spacer"></div>
    <span class="stage-label" id="stage-label">Tour · 1 / 5</span>
    <button class="ghost-btn" id="refresh-btn" title="Re-fetch live data">⟳ Refresh</button>
  </header>

  <main class="stage">
    <div id="map" role="application" aria-label="Seismic forecast map"></div>

    <nav class="rail" id="rail" aria-label="Tour progress"></nav>

    <div class="maplegend" id="maplegend" hidden></div>

    <aside class="card" id="beatcard" aria-live="polite">
      <div class="kicker">
        <span class="num" id="beatnum">BEAT 1 / 5</span>
        <span class="bstag" id="beattag">Observation</span>
      </div>
      <h1 id="beathead">The Watch</h1>
      <p class="hint" id="beathint"></p>
      <div class="signals" id="signals"></div>
      <div class="legend" id="beatlegend"></div>
      <div class="nav">
        <button class="back" id="back-btn" disabled>← Back</button>
        <button class="cta" id="cta-btn">Beat 2 — The Signal →</button>
      </div>
    </aside>

    <section class="dash" id="dash" hidden>
      <div class="seg">
        <span class="seg-label">Alert threshold</span>
        <div class="threshold">
          <input type="range" id="thr" min="0" max="100" value="50" aria-label="Alert threshold percent" />
          <span class="val" id="thr-val">50%</span>
        </div>
      </div>
      <div class="seg">
        <span class="seg-label" id="score-label">Model scorecard · test partition</span>
        <div class="stat-row" id="scorecard"></div>
      </div>
      <div class="seg">
        <span class="seg-label">Highest risk cells</span>
        <div class="toplist" id="toplist"></div>
      </div>
    </section>
  </main>

  <footer class="footbar">
    <span class="disclaimer">Research prototype — not a public warning system.</span>
    <span class="latency" id="latency-note"></span>
  </footer>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
  <script src="/static/baked.js" onerror="window.SEISMIC_BAKED=null"></script>
  <script src="/static/app.js"></script>
</body>
</html>
