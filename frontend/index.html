<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SeismicML Live Forecast</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    html, body { margin: 0; height: 100%; }
    #map { height: 100vh; width: 100%; }
    #legend {
      position: absolute; z-index: 1000; bottom: 18px; right: 18px;
      background: rgba(0,0,0,0.7); color: #fff; padding: 10px 12px;
      font: 13px/1.4 system-ui, sans-serif; border-radius: 6px;
    }
    #legend .sw { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="legend">
    <div><span class="sw" style="background:orange"></span>Pending alert (prob &ge; 0.5)</div>
    <div><span class="sw" style="background:#00FF00"></span>True Positive</div>
    <div><span class="sw" style="background:#FFA500"></span>False Positive</div>
    <div><span class="sw" style="background:#FF0000"></span>False Negative</div>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script>const FORECAST = {{ forecast | tojson | safe }};</script>
  <script src="/static/app.js"></script>
</body>
</html>
